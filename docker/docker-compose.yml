services:
  fontaneous:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fontaneous_app_v2
    ports:
      - "8501:8501"
    environment:
      TESSERACT_CMD: /usr/bin/tesseract
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    volumes:
      - ..:/app
      - huggingface_cache:/root/.cache/huggingface
    working_dir: /app
    command:
      - sh
      - -lc
      - if [ ! -x .venv/bin/python ]; then sh docker/setup_linux_venv.sh; fi && exec .venv/bin/streamlit run src/main.py --server.address=0.0.0.0 --server.port=8501

volumes:
  huggingface_cache:
